<title>Blindspot</title>
<style>
/*
 * The report panel.
 *
 * It runs in two places from one file: inside VS Code as a webview, and in a
 * browser as the demo. So every colour and both typefaces are the editor's own
 * where the editor is there to ask, and a plain fallback where it is not. A
 * panel that paints its own near-black over someone's light theme is a foreign
 * object in their workspace, and a panel that needs a font off the network is
 * one that looks wrong on a train.
 *
 * One saturated colour is allowed on the page, and it is the unread mark. It is
 * the orange of the gutter bar the extension already draws, so what the panel
 * says and what the editor shows are the same claim in the same colour.
 */
:root {
  --bg: var(--vscode-editor-background, #fbfbfa);
  --fg: var(--vscode-editor-foreground, #1a1d21);
  --muted: var(--vscode-descriptionForeground, #63696f);
  --rule: var(--vscode-widget-border, #dfe1e4);
  --sunk: var(--vscode-editorWidget-background, #f2f2f1);
  --unread: #c2410c;
  --unread-wash: #c2410c14;
  --severe: var(--vscode-errorForeground, #b42318);
  --link: var(--vscode-textLink-foreground, #0b5fb0);
  --ui: var(--vscode-font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --code: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  --ui-size: var(--vscode-font-size, 14px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--vscode-editor-background, #14171c);
    --fg: var(--vscode-editor-foreground, #dfe3e8);
    --muted: var(--vscode-descriptionForeground, #8b929c);
    --rule: var(--vscode-widget-border, #272c33);
    --sunk: var(--vscode-editorWidget-background, #1b1f25);
    --unread: #f97316;
    --unread-wash: #f9731620;
    --severe: var(--vscode-errorForeground, #f2776b);
    --link: var(--vscode-textLink-foreground, #6cb6ff);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  font-size: var(--ui-size);
  line-height: 1.6;
}

.page {
  max-width: 62rem;
  margin: 0 auto;
  padding: 3.5rem 2rem 5rem;
  display: flex;
  flex-direction: column;
  gap: 2.75rem;
}

/* ------------------------------------------------------------- the answer */

.answer h1 {
  margin: 0;
  font-size: clamp(1.6rem, 1.1rem + 2vw, 2.5rem);
  font-weight: 600;
  letter-spacing: -0.018em;
  line-height: 1.15;
  max-width: 22ch;
}
.answer h1 .n { color: var(--unread); font-variant-numeric: tabular-nums; }
.answer.clear h1 .n { color: inherit; }
.answer p {
  margin: 0.7rem 0 0;
  color: var(--muted);
  max-width: 52ch;
}
.answer p b { color: var(--severe); font-weight: 600; }

.act {
  margin-top: 1.4rem;
  font: inherit;
  font-weight: 500;
  color: var(--bg);
  background: var(--fg);
  border: 1px solid var(--fg);
  border-radius: 3px;
  padding: 0.5rem 1rem;
  cursor: pointer;
}
.act:hover { opacity: 0.86; }
.act:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* ---------------------------------------------------------------- the map */

/*
 * Every target line of the whole change, one bar each, files side by side and
 * as wide as they are long. A percentage cannot tell you whether the part you
 * missed is scattered through the diff or is one block you skipped; this can,
 * at a glance, which is the only thing this panel has to do quickly.
 */
.map { display: flex; flex-direction: column; gap: 0.5rem; }
.map-strip { display: flex; gap: 3px; height: 4.5rem; }
.map-file {
  display: flex;
  gap: 0;
  min-width: 4px;
  background: var(--sunk);
  border: 1px solid transparent;
  border-radius: 2px;
  overflow: hidden;
  padding: 0;
  cursor: pointer;
}
.map-file:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.map-file[aria-pressed="true"] { border-color: var(--fg); }
.map-file i { flex: 1 1 0; min-width: 1px; }
.map-file i.read { background: var(--muted); opacity: 0.3; }
.map-file i.unread { background: var(--unread); }
.map-file i.unread.severe { background: var(--severe); }
.map-legend {
  display: flex;
  gap: 3px;
  font-size: 0.75rem;
  color: var(--muted);
  font-family: var(--code);
}
.map-legend span {
  min-width: 4px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* -------------------------------------------------------------- the files */

/* Fixed layout so the numbers keep their place: the file column takes what is
   left, and a column whose header is hidden on a narrow panel is gone rather
   than reserved. */
.files { width: 100%; border-collapse: collapse; table-layout: fixed; }
.files th.n { width: 6rem; }
.files th.risk { width: 15rem; }
.files th {
  text-align: left;
  font-weight: 400;
  font-size: 0.8rem;
  color: var(--muted);
  padding: 0 1.25rem 0.5rem 0;
  border-bottom: 1px solid var(--rule);
}
.files th.n, .files td.n { text-align: right; font-variant-numeric: tabular-nums; }
.files th:last-child, .files td:last-child { padding-right: 0; }
.files td {
  padding: 0.55rem 1.25rem 0.55rem 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: baseline;
}
.files tbody tr { cursor: pointer; }
.files tbody tr:hover td { background: var(--sunk); }
.files tbody tr[aria-selected="true"] td { background: var(--unread-wash); }
.files td.path {
  font-family: var(--code); font-size: 0.86rem; overflow-wrap: anywhere;
}
.files td.n { font-family: var(--code); font-size: 0.86rem; }
.files td.n.some { color: var(--unread); }
.files .of { color: var(--muted); }
.files td.risk { font-size: 0.82rem; color: var(--muted); }
.files td.risk.severe { color: var(--severe); }
.files tr.done td.path { color: var(--muted); }

/* --------------------------------------------------------------- the code */

.code {
  font-family: var(--code);
  font-size: 0.82rem;
  line-height: 1.7;
  background: var(--sunk);
  border-radius: 3px;
  overflow-x: auto;
  padding: 0.75rem 0;
}
.ln { display: grid; grid-template-columns: 3.75rem 1fr; }
.ln .num {
  text-align: right;
  padding-right: 1rem;
  color: var(--muted);
  opacity: 0.55;
  user-select: none;
}
.ln .txt { white-space: pre; padding-right: 1.5rem; }
.ln.unread { background: var(--unread-wash); box-shadow: inset 3px 0 0 var(--unread); }
.ln.unread.severe { box-shadow: inset 3px 0 0 var(--severe); }
.ln.unread .num { color: var(--unread); opacity: 1; }
.ln.read .txt { opacity: 0.45; }
.vscode .ln.unread { cursor: pointer; }
.caption { margin: 0.6rem 0 0; font-size: 0.82rem; color: var(--muted); }

/* --------------------------------------------------------- the definition */

.rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

.def { display: flex; flex-direction: column; gap: 0.9rem; }
.def h2 { margin: 0; font-size: 1rem; font-weight: 600; }
.slider { display: flex; align-items: center; gap: 1rem; max-width: 34rem; }
.slider input { flex: 1; accent-color: var(--unread); }
.slider output {
  font-family: var(--code);
  font-size: 0.86rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.def p { margin: 0; color: var(--muted); max-width: 60ch; }
.def p .n { color: var(--fg); font-variant-numeric: tabular-nums; }

details summary {
  cursor: pointer;
  color: var(--link);
  font-size: 0.9rem;
  width: fit-content;
}
details summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
details[open] summary { margin-bottom: 1rem; }

.kv { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
.kv:last-child { margin-bottom: 0; }
.kv caption {
  text-align: left;
  font-size: 0.82rem;
  color: var(--muted);
  padding-bottom: 0.4rem;
}
.kv td {
  padding: 0.4rem 1.25rem 0.4rem 0;
  border-top: 1px solid var(--rule);
  vertical-align: baseline;
  font-size: 0.86rem;
}
.kv td:last-child { padding-right: 0; }
.kv td.k { font-family: var(--code); width: 9rem; }
.kv td.v { color: var(--muted); }
.kv td.pts { font-family: var(--code); text-align: right; width: 3rem; }

@media (min-width: 40.001rem) {
  .files .of { display: none; }
}
@media (max-width: 40rem) {
  .page { padding: 2rem 1.1rem 3rem; gap: 2rem; }
  .map-strip { height: 3rem; }
  .map-legend { display: none; }
  .files .risk, .files .changed { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="page">

<section class="answer" id="answer">
  <h1 id="head"></h1>
  <p id="sub"></p>
  <button class="act" id="go" type="button">Go to the first unread line</button>
</section>

<section class="map" id="map" aria-label="Every changed line, by file">
  <div class="map-strip" id="strip"></div>
  <div class="map-legend" id="strip-labels" aria-hidden="true"></div>
</section>

<section>
  <table class="files">
    <thead>
      <tr>
        <th>File</th>
        <th class="n">Unread</th>
        <th class="n changed">Changed</th>
        <th class="risk">Riskiest thing you missed</th>
      </tr>
    </thead>
    <tbody id="files"></tbody>
  </table>
</section>

<section>
  <div class="code" id="code"></div>
  <p class="caption" id="caption"></p>
</section>

<hr class="rule">

<section class="def">
  <h2>What counts as read</h2>
  <div class="slider">
    <input type="range" id="thr" min="1" max="6" step="1" value="3"
           aria-label="Points a line needs before it counts as read">
    <output id="thr-out" for="thr"></output>
  </div>
  <p id="thr-note"></p>
  <details>
    <summary>How a line earns its points</summary>
    <table class="kv">
      <caption>Signals, and what each is worth here</caption>
      <tbody id="signal-rows"></tbody>
    </table>
    <table class="kv">
      <caption>The settings this report was measured under</caption>
      <tbody id="setting-rows"></tbody>
    </table>
  </details>
</section>

</div>

<script>
// Inside the editor the page is a webview and can talk back to it; in a
// browser it is the demo and cannot.
const vscode = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;

let DATA, W, LINES;
const RISK_RANK = { critical: 4, high: 3, medium: 2, low: 1 };

// ------------------------------------------------------------------- model

function pointsOf(sig) {
  return (sig.visible ? W.visible : 0) + (sig.focused ? W.focused : 0) +
         (sig.dwell ? W.dwell : 0) + (sig.caret ? W.caret : 0) +
         (sig.edited ? W.edited : 0) + (sig.revisit ? W.revisit : 0);
}

// The model's rule, as src/core/evidence.ts states it: enough signals, and
// either the reader wrote the line or looked at it for long enough.
function isRead(l, threshold) {
  return l.points >= threshold && (l.signals.edited || l.read >= 1);
}

function index(data) {
  return data.files.map(f => ({
    path: f.path,
    lines: f.lines.map(l => ({
      ...l,
      points: pointsOf(l.signals),
      severe: l.risk === 'critical' || l.risk === 'high',
    })),
  }));
}

function compute(threshold) {
  let total = 0, unseen = 0, severeTotal = 0, severeUnseen = 0;
  const files = [];

  for (const f of LINES) {
    const missed = [];
    for (const l of f.lines) {
      total++;
      if (l.severe) severeTotal++;
      if (!isRead(l, threshold)) {
        missed.push(l);
        unseen++;
        if (l.severe) severeUnseen++;
      }
    }
    files.push({
      path: f.path,
      changed: f.lines.length,
      unseen: missed.length,
      risk: missed.length ? maxRisk(missed.map(l => l.risk)) : 'low',
      hunks: groupHunks(missed),
    });
  }

  return { total, unseen, severeTotal, severeUnseen, files };
}

function groupHunks(unseen) {
  if (!unseen.length) return [];
  const sorted = [...unseen].sort((a, b) => a.n - b.n);
  const out = [];
  let batch = [sorted[0]];
  const flush = () => {
    const risk = maxRisk(batch.map(l => l.risk));
    out.push({
      start: batch[0].n, end: batch[batch.length - 1].n, count: batch.length, risk,
      reason: (batch.find(l => l.risk === risk) || batch[0]).reason,
    });
  };
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i].n - batch[batch.length - 1].n <= 3) batch.push(sorted[i]);
    else { flush(); batch = [sorted[i]]; }
  }
  flush();
  return out;
}

const maxRisk = ls => ls.reduce((best, l) => (RISK_RANK[l] > RISK_RANK[best] ? l : best), 'low');
const severe = r => r === 'critical' || r === 'high';
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

function rank(files) {
  return [...files].sort((a, b) =>
    (b.unseen > 0) - (a.unseen > 0) ||
    RISK_RANK[b.risk] - RISK_RANK[a.risk] ||
    b.unseen - a.unseen ||
    a.path.localeCompare(b.path));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;');
}

// ------------------------------------------------------------------ render

let threshold = 3;
let selected = null;
let state = null;

const $ = id => document.getElementById(id);

function renderAnswer() {
  const clear = state.unseen === 0;
  $('answer').classList.toggle('clear', clear);
  $('head').innerHTML = clear
    ? 'You read every changed line.'
    : '<span class="n">' + state.unseen + '</span> ' +
      (state.unseen === 1 ? 'line you did not read' : 'lines you did not read');

  if (clear) {
    $('sub').textContent = 'All ' + plural(state.total, 'changed line', 'changed lines') +
      ' cleared the threshold below.';
  } else {
    const parts = ['of ' + plural(state.total, 'changed line', 'changed lines') + '.'];
    if (state.severeUnseen > 0) {
      parts.push('<b>' + state.severeUnseen + ' of them in high-risk code.</b>');
    } else if (state.severeTotal > 0) {
      parts.push('None of them in the high-risk code.');
    }
    $('sub').innerHTML = parts.join(' ');
  }
  $('go').hidden = clear || !vscode;
}

function renderMap() {
  const ranked = state.files;
  $('strip').innerHTML = ranked.map(f => {
    const src = LINES.find(x => x.path === f.path);
    const bars = src.lines.map(l => {
      const read = isRead(l, threshold);
      return '<i class="' + (read ? 'read' : 'unread' + (l.severe ? ' severe' : '')) + '"></i>';
    }).join('');
    return '<button class="map-file" type="button" style="flex:' + f.changed + ' 1 0"' +
      ' data-file="' + escapeHtml(f.path) + '"' +
      ' aria-pressed="' + (f.path === selected) + '"' +
      ' title="' + escapeHtml(f.path + ' — ' + f.unseen + ' of ' + f.changed + ' unread') + '">' +
      bars + '</button>';
  }).join('');

  $('strip-labels').innerHTML = ranked.map(f =>
    '<span style="flex:' + f.changed + ' 1 0">' +
    escapeHtml(f.path.split('/').pop()) + '</span>').join('');

  for (const b of $('strip').querySelectorAll('.map-file')) {
    b.addEventListener('click', () => select(b.dataset.file));
  }
}

function renderFiles() {
  $('files').innerHTML = state.files.map(f =>
    '<tr data-file="' + escapeHtml(f.path) + '"' +
      ' aria-selected="' + (f.path === selected) + '"' +
      (f.unseen ? '' : ' class="done"') + '>' +
      '<td class="path">' + escapeHtml(f.path) + '</td>' +
      '<td class="n' + (f.unseen ? ' some' : '') + '">' + f.unseen +
        '<span class="of"> / ' + f.changed + '</span></td>' +
      '<td class="n changed">' + f.changed + '</td>' +
      '<td class="risk' + (f.unseen && severe(f.risk) ? ' severe' : '') + '">' +
        (f.unseen ? escapeHtml(f.hunks[0].reason) : 'nothing') + '</td>' +
    '</tr>').join('');

  for (const row of $('files').querySelectorAll('tr[data-file]')) {
    row.addEventListener('click', () => select(row.dataset.file));
  }
}

function renderCode() {
  const file = LINES.find(f => f.path === selected);
  if (!file) {
    $('code').innerHTML = '';
    $('caption').textContent = 'Nothing has been opened here yet.';
    return;
  }
  $('code').innerHTML = file.lines.map(l => {
    const read = isRead(l, threshold);
    const cls = read ? 'read' : 'unread' + (l.severe ? ' severe' : '');
    return '<div class="ln ' + cls + '" data-line="' + l.n + '">' +
      '<span class="num">' + l.n + '</span>' +
      '<span class="txt">' + escapeHtml(l.text || ' ') + '</span></div>';
  }).join('');

  const f = state.files.find(x => x.path === selected);
  $('caption').textContent = f.unseen
    ? f.path + ' — ' + f.unseen + ' of ' + f.changed + ' lines unread'
    : f.path + ' — all ' + f.changed + ' lines read';

  if (!vscode) return;
  for (const ln of $('code').querySelectorAll('.ln.unread')) {
    ln.addEventListener('click', () =>
      vscode.postMessage({ type: 'open', file: selected, line: Number(ln.dataset.line) }));
  }
}

function renderThreshold() {
  const cap = Object.values(W).reduce((a, b) => a + b, 0);
  $('thr-out').textContent = threshold + ' of ' + cap + ' points';
  $('thr-note').innerHTML = 'At <span class="n">' + threshold + '</span> points, ' +
    '<span class="n">' + state.unseen + '</span> of ' +
    '<span class="n">' + state.total + '</span> lines count as unread. ' +
    'This preview leaves your setting alone.';
}

const SIGNALS = [
  ['visible', s => 'on screen for ' + ms(s.visibleMsForPoint) + ' or more'],
  ['focused', s => 'in the active editor, window focused, for ' + ms(s.focusedMsForPoint)],
  ['dwell', s => 'the viewport held still for ' + ms(s.dwellMs)],
  ['caret', () => 'you put the cursor on it, or the mouse came to rest on it'],
  ['edited', () => 'you typed it yourself'],
  ['revisit', s => 'you came back to it after ' + ms(s.revisitGapMs) + ' away'],
];

function ms(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '—';
  return n >= 1000 ? +(n / 1000).toFixed(n % 1000 ? 1 : 0) + ' s' : n + ' ms';
}

// The signals come from the configured weights, not from a table written by
// hand: a panel that says +1 while the config says +2 is worse than one that
// says nothing.
function renderDefinition() {
  const cfg = DATA.settings;
  $('signal-rows').innerHTML = SIGNALS.map(([name, when]) =>
    '<tr><td class="k">' + name + '</td>' +
    '<td class="v">' + escapeHtml(when(cfg)) + '</td>' +
    '<td class="pts">+' + escapeHtml(W[name] || 0) + '</td></tr>').join('');

  const rows = [
    ['threshold', DATA.threshold + ' points, from blindspot.reviewThresholdPoints'],
    ['read after', ms(cfg.readAckMs) + ' of focused time on the line'],
    ['focus caps', 'credit stops growing after ' + ms(cfg.focusCapMs)],
    ['idle after', ms(cfg.idleAfterMs) + ' with no caret, scroll, mouse or edit'],
    ['scroll limit', cfg.readingSpeedGuard
      ? 'past ' + cfg.maxLinesPerSecond + ' lines a second, nothing counts'
      : 'off'],
    ['focus falloff', cfg.focalModel
      ? 'full credit within ' + cfg.focalSpanLines + ' lines, down to ' +
        cfg.peripheralFloor + ' by ' + cfg.focalDecayLines
      : 'off, every visible line credited alike'],
    ['line cost', cfg.contentScaling ? 'thresholds scale with tokens on the line' : 'off'],
  ];
  $('setting-rows').innerHTML = rows.map(([k, v]) =>
    '<tr><td class="k">' + k + '</td><td class="v" colspan="2">' +
    escapeHtml(v) + '</td></tr>').join('');
}

function select(path) {
  selected = path;
  renderMap();
  renderFiles();
  renderCode();
}

function renderAll() {
  state = compute(threshold);
  state.files = rank(state.files);
  if (!state.files.some(f => f.path === selected)) {
    selected = state.files.length ? state.files[0].path : null;
  }
  renderAnswer();
  renderMap();
  renderFiles();
  renderCode();
  renderThreshold();
  renderDefinition();
}

$('thr').addEventListener('input', e => {
  threshold = Number(e.target.value);
  renderAll();
});

$('go').addEventListener('click', () => {
  if (vscode) vscode.postMessage({ type: 'reviewNext' });
});

if (vscode) document.documentElement.classList.add('vscode');

function load(data) {
  DATA = data;
  W = data.weights;
  LINES = index(data);
  threshold = data.threshold;
  $('thr').value = String(threshold);
  renderAll();
}

window.addEventListener('message', e => load(e.data));
load(__DATA__);
</script>
