name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms, because the git hook, the state path and the diff parser
    # all touch things that differ between them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # The demo replays a scripted session through the real model, so it
      # fails if the model stops producing a report at all.
      - run: npm run demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: blindspot-vsix
          path: '*.vsix'
