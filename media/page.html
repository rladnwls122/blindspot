<title>Blindspot</title>
<style>
/*
 * The report panel.
 *
 * It runs in two places from one file: inside VS Code as a webview, and in a
 * browser as the demo. Colours come from the editor's own theme where the
 * editor is there to ask — a panel that paints its own black over someone's
 * light theme is a foreign object in their workspace — and the type is the two
 * faces already on the machine: the editor's monospace for everything measured,
 * the UI font for everything said. Nothing is fetched.
 *
 * It is drawn as an instrument rather than a dashboard, because it is one. The
 * single saturated colour is the unread mark, and it is the orange of the
 * gutter bar the extension already draws, so the panel and the editor make the
 * same claim in the same colour.
 */
:root {
  --bg: var(--vscode-editor-background, #fcfcfb);
  --fg: var(--vscode-editor-foreground, #16181c);
  --muted: var(--vscode-descriptionForeground, #6a7079);
  --rule: var(--vscode-widget-border, #e1e3e7);
  --sunk: var(--vscode-editorWidget-background, #f4f4f3);
  --unread: #c2410c;
  --unread-wash: #c2410c14;
  --severe: var(--vscode-errorForeground, #b42318);
  --link: var(--vscode-textLink-foreground, #0b5fb0);
  --grid: #6a707914;
  --ui: var(--vscode-font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  --mono: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--vscode-editor-background, #131519);
    --fg: var(--vscode-editor-foreground, #e2e5ea);
    --muted: var(--vscode-descriptionForeground, #888f99);
    --rule: var(--vscode-widget-border, #272b32);
    --sunk: var(--vscode-editorWidget-background, #191c21);
    --unread: #f97316;
    --unread-wash: #f9731618;
    --severe: var(--vscode-errorForeground, #ef6a5e);
    --link: var(--vscode-textLink-foreground, #6cb6ff);
    --grid: #888f9918;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 64rem; margin: 0 auto; padding: 3rem 2rem 4rem; }

/*
 * A label sitting on its own rule rather than floating above the content as a
 * tracked-out caption: one device marks the section break and names it, and the
 * right-hand slot carries whatever reading belongs to that band.
 */
.band {
  display: flex;
  align-items: baseline;
  gap: 0.9rem;
  margin: 2.9rem 0 1rem;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--muted);
}
.band .fill { flex: 1; border-top: 1px solid var(--rule); transform: translateY(-0.25em); }
.band .aside { font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; }
.band .name { font-family: var(--mono); color: var(--fg); }

/* ------------------------------------------------------------- the answer */

.answer { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.4rem 3rem; }
.answer .say { flex: 1 1 24rem; }

h1 {
  margin: 0;
  font-family: var(--mono);
  font-size: clamp(1.75rem, 1rem + 2.7vw, 2.9rem);
  font-weight: 500;
  letter-spacing: -0.05em;
  line-height: 1.02;
}
h1 .n { color: var(--unread); }
.clear h1 .n { color: inherit; }
h1 .rest { color: var(--muted); }

.answer p { margin: 0.9rem 0 0; color: var(--muted); max-width: 44ch; }
.answer p b { color: var(--severe); font-weight: 600; }

/* The controls are an instrument's, not a web form's: ruled, not filled. */
.act, .seg button, .flag {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.5rem 0.85rem;
  cursor: pointer;
}
.act { color: var(--fg); border-color: var(--fg); white-space: nowrap; }
.act:hover { background: var(--fg); color: var(--bg); }
.act:focus-visible, .seg button:focus-visible, .flag:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 2px;
}

/* ------------------------------------------------------------ the reading */

/*
 * Every target line of the change, plotted by the points its evidence earned,
 * with the review threshold ruled across it. Everything under that rule is the
 * blindspot — so moving the threshold moves the rule, and what the setting
 * means stops being a sentence and becomes a picture.
 */
.chart {
  position: relative;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--sunk);
}
.plotwrap { position: relative; padding-left: 2.1rem; }
.chart svg { display: block; width: 100%; height: 10.5rem; }

/* The scale the bars are read against: the ceiling, the rule, and nothing. */
.ticks {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2.1rem;
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--muted);
  border-right: 1px solid var(--rule);
}
.ticks span { position: absolute; right: 0.4rem; transform: translateY(-50%); }
.ticks .thr { color: var(--unread); }
.readout {
  position: absolute;
  top: 0.6rem;
  right: 0.8rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--muted);
  pointer-events: none;
  background: var(--sunk);
  padding: 0 0.3rem;
  border-radius: 2px;
  z-index: 1;
}
.readout b { color: var(--fg); font-weight: 500; }

.axis {
  display: flex;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.7rem;
}
.axis button {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-align: left;
  font: inherit;
  color: var(--muted);
  background: none;
  border: 0;
  border-left: 1px solid var(--rule);
  padding: 0.5rem;
  cursor: pointer;
}
.axis button:first-child { border-left: 0; }
.axis button:hover { color: var(--fg); }
.axis button[aria-pressed="true"] { color: var(--fg); background: var(--unread-wash); }
.axis button:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }

/* Drawn once on open, left to right, and never again. */
.sweep { animation: sweep 640ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
@keyframes sweep { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* -------------------------------------------------------------- the files */

.files { width: 100%; border-collapse: collapse; table-layout: fixed; }
.files th {
  text-align: left;
  font-weight: 400;
  font-size: 0.76rem;
  color: var(--muted);
  padding: 0 1rem 0.5rem 0;
  border-bottom: 1px solid var(--fg);
}
.files th.n { width: 6rem; }
.files th.risk { width: 15rem; }
.files th.n, .files td.n { text-align: right; font-variant-numeric: tabular-nums; }
.files th:last-child, .files td:last-child { padding-right: 0; }
.files td {
  padding: 0.55rem 1rem 0.55rem 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: baseline;
}
.files tbody tr { cursor: pointer; }
.files tbody tr:hover td { background: var(--grid); }
.files tbody tr[aria-selected="true"] td { background: var(--unread-wash); }
.files td.path {
  font-family: var(--mono);
  font-size: 0.82rem;
  overflow-wrap: anywhere;
  padding-left: 0.6rem;
  box-shadow: inset 2px 0 0 transparent;
}
.files tr[aria-selected="true"] td.path { box-shadow: inset 2px 0 0 var(--unread); }
.files td.n { font-family: var(--mono); font-size: 0.86rem; }
.files td.n .u { color: var(--unread); }
.files td.n .u.sev { color: var(--severe); }
.files td.n .of { color: var(--muted); font-size: 0.76rem; }
.files td.risk { font-size: 0.8rem; color: var(--muted); }
.files td.risk.sev { color: var(--severe); }
.files tr.done td.path, .files tr.done td.n { color: var(--muted); }

/* --------------------------------------------------------------- the code */

.code {
  font-family: var(--mono);
  font-size: 0.8rem;
  line-height: 1.75;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--sunk);
  overflow-x: auto;
  padding: 0.55rem 0;
}
.ln { display: grid; grid-template-columns: 3.4rem 1fr; }
.ln .num {
  text-align: right;
  padding-right: 0.85rem;
  margin-right: 0.85rem;
  border-right: 1px solid var(--rule);
  color: var(--muted);
  opacity: 0.6;
  user-select: none;
}
.ln .txt { white-space: pre; padding-right: 1.5rem; }
.ln.unread { background: var(--unread-wash); }
.ln.unread .num {
  color: var(--unread);
  opacity: 1;
  border-right: 2px solid var(--unread);
  margin-right: calc(0.85rem - 1px);
}
.ln.unread.sev .num { color: var(--severe); border-right-color: var(--severe); }
.ln.read .txt { opacity: 0.5; }
.vscode .ln.unread { cursor: pointer; }
.caption { margin: 0.6rem 0 0; font-family: var(--mono); font-size: 0.73rem; color: var(--muted); }

/* ------------------------------------------------------------ the settings */

.settings { display: grid; grid-template-columns: minmax(17rem, 23rem) 1fr; gap: 2.5rem; }
.control + .control { margin-top: 1.6rem; }
.control > .lab { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.5rem; }
.slider { display: flex; align-items: center; gap: 0.9rem; }
.slider input { flex: 1; min-width: 0; accent-color: var(--unread); }
.slider output {
  font-family: var(--mono);
  font-size: 0.8rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.hint { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.8rem; max-width: 38ch; }
.hint .n { color: var(--fg); font-variant-numeric: tabular-nums; }

.seg { display: flex; }
.seg button { border-radius: 0; border-left-width: 0; flex: 1; text-align: center; }
.seg button:first-child { border-left-width: 1px; border-radius: 2px 0 0 2px; }
.seg button:last-child { border-radius: 0 2px 2px 0; }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }

.flags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.flag::before {
  content: "";
  display: inline-block;
  width: 0.5rem;
  height: 0.5rem;
  margin-right: 0.5rem;
  border-radius: 50%;
  background: var(--rule);
  vertical-align: 0.02em;
}
.flag[aria-pressed="true"] { color: var(--fg); border-color: var(--muted); }
.flag[aria-pressed="true"]::before { background: var(--unread); }

.kv { width: 100%; border-collapse: collapse; }
.kv + .kv { margin-top: 1.5rem; }
.kv td {
  padding: 0.35rem 1rem 0.35rem 0;
  border-top: 1px solid var(--rule);
  vertical-align: baseline;
  font-size: 0.82rem;
}
.kv tr:first-child td { border-top: 0; }
.kv td:last-child { padding-right: 0; }
.kv td.k { font-family: var(--mono); width: 8.5rem; }
.kv td.v { color: var(--muted); }
.kv td.pts { font-family: var(--mono); text-align: right; width: 3rem; color: var(--muted); }

@media (max-width: 46rem) {
  .page { padding: 2rem 1.1rem 3rem; }
  .settings { grid-template-columns: 1fr; gap: 1.6rem; }
  .files .risk, .files .changed { display: none; }
  .chart svg { height: 8rem; }
}

@media (prefers-reduced-motion: reduce) {
  .sweep { animation: none; }
}
</style>

<div class="page">

<section class="answer" id="answer">
  <div class="say">
    <h1 id="head"></h1>
    <p id="sub"></p>
  </div>
  <button class="act" id="go" type="button">Go to the first unread line</button>
</section>

<h2 class="band">Points earned, line by line<span class="fill"></span><span class="aside" id="scale"></span></h2>
<div class="chart">
  <div class="plotwrap">
    <div class="readout" id="readout"></div>
    <div class="ticks" aria-hidden="true">
      <span class="cap" id="tk-cap" style="top:0.5rem"></span>
      <span class="thr" id="tk-thr"></span>
      <span class="zero" style="bottom:0.1rem">0</span>
    </div>
    <svg id="plot" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>
  <div class="axis" id="axis"></div>
</div>

<h2 class="band">Files, worst first<span class="fill"></span></h2>
<table class="files">
  <thead>
    <tr>
      <th>File</th>
      <th class="n">Unread</th>
      <th class="n changed">Changed</th>
      <th class="risk">Riskiest thing you missed</th>
    </tr>
  </thead>
  <tbody id="files"></tbody>
</table>

<h2 class="band"><span class="name" id="code-name"></span><span class="fill"></span><span class="aside" id="caption"></span></h2>
<div class="code" id="code"></div>

<h2 class="band">Settings<span class="fill"></span><span class="aside">saved to this workspace</span></h2>
<div class="settings">
  <div>
    <div class="control">
      <span class="lab" id="thr-lab">Points a line needs before it counts as read</span>
      <div class="slider">
        <input type="range" id="thr" min="1" max="6" step="1" value="3" aria-labelledby="thr-lab">
        <output id="thr-out" for="thr"></output>
      </div>
      <p class="hint" id="thr-note"></p>
    </div>

    <div class="control">
      <span class="lab" id="mode-lab">What to measure</span>
      <div class="seg" role="group" aria-labelledby="mode-lab" id="mode"></div>
      <p class="hint" id="mode-note"></p>
    </div>

    <div class="control">
      <span class="lab">Where the report shows up</span>
      <div class="flags" id="flags"></div>
    </div>
  </div>

  <div>
    <table class="kv"><tbody id="signal-rows"></tbody></table>
    <table class="kv"><tbody id="setting-rows"></tbody></table>
  </div>
</div>

</div>

<script>
// Inside the editor the page is a webview and can talk back to it; in a
// browser it is the demo and cannot.
const vscode = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;

let DATA, W, LINES, CAP;
const RISK_RANK = { critical: 4, high: 3, medium: 2, low: 1 };
/** Columns the plot draws at most; past this, lines share one. */
const MAX_COLS = 900;

// ------------------------------------------------------------------- model

function pointsOf(sig) {
  return (sig.visible ? W.visible : 0) + (sig.focused ? W.focused : 0) +
         (sig.dwell ? W.dwell : 0) + (sig.caret ? W.caret : 0) +
         (sig.edited ? W.edited : 0) + (sig.revisit ? W.revisit : 0);
}

// The model's rule, as src/core/evidence.ts states it: enough signals, and
// either the reader wrote the line or looked at it for long enough.
function isRead(l, threshold) {
  return l.points >= threshold && (l.signals.edited || l.read >= 1);
}

function index(data) {
  return data.files.map(f => ({
    path: f.path,
    lines: f.lines.map(l => ({
      ...l,
      points: pointsOf(l.signals),
      sev: l.risk === 'critical' || l.risk === 'high',
    })),
  }));
}

function compute(threshold) {
  let total = 0, unseen = 0, sevTotal = 0, sevUnseen = 0;
  const files = [];
  for (const f of LINES) {
    const missed = [];
    for (const l of f.lines) {
      total++;
      if (l.sev) sevTotal++;
      if (!isRead(l, threshold)) {
        missed.push(l);
        unseen++;
        if (l.sev) sevUnseen++;
      }
    }
    files.push({
      path: f.path,
      changed: f.lines.length,
      unseen: missed.length,
      risk: missed.length ? maxRisk(missed.map(l => l.risk)) : 'low',
      hunks: groupHunks(missed),
    });
  }
  return { total, unseen, sevTotal, sevUnseen, files };
}

function groupHunks(unseen) {
  if (!unseen.length) return [];
  const sorted = [...unseen].sort((a, b) => a.n - b.n);
  const out = [];
  let batch = [sorted[0]];
  const flush = () => {
    const risk = maxRisk(batch.map(l => l.risk));
    out.push({
      start: batch[0].n, end: batch[batch.length - 1].n, count: batch.length, risk,
      reason: (batch.find(l => l.risk === risk) || batch[0]).reason,
    });
  };
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i].n - batch[batch.length - 1].n <= 3) batch.push(sorted[i]);
    else { flush(); batch = [sorted[i]]; }
  }
  flush();
  return out;
}

const maxRisk = ls => ls.reduce((best, l) => (RISK_RANK[l] > RISK_RANK[best] ? l : best), 'low');
const isSev = r => r === 'critical' || r === 'high';
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

function rank(files) {
  return [...files].sort((a, b) =>
    (b.unseen > 0) - (a.unseen > 0) ||
    RISK_RANK[b.risk] - RISK_RANK[a.risk] ||
    b.unseen - a.unseen ||
    a.path.localeCompare(b.path));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;');
}

// ------------------------------------------------------------------ render

let threshold = 3;
let selected = null;
let state = null;
let drawn = false;

const $ = id => document.getElementById(id);

function renderAnswer() {
  const clear = state.unseen === 0;
  $('answer').classList.toggle('clear', clear);
  $('head').innerHTML = clear
    ? 'Every line read'
    : '<span class="n">' + state.unseen + '</span> ' +
      '<span class="rest">' + (state.unseen === 1 ? 'line unread' : 'lines unread') + '</span>';

  if (clear) {
    $('sub').textContent = 'All ' + plural(state.total, 'changed line', 'changed lines') +
      ' cleared the threshold.';
  } else {
    const parts = ['Out of ' + plural(state.total, 'changed line', 'changed lines') + '.'];
    if (state.sevUnseen > 0) {
      parts.push('<b>' + state.sevUnseen + ' of them in high-risk code.</b>');
    } else if (state.sevTotal > 0) {
      parts.push('None of them in the high-risk code.');
    }
    $('sub').innerHTML = parts.join(' ');
  }
  $('go').hidden = clear || !vscode;
}

/**
 * One column per line where they fit, otherwise one column per group carrying
 * the worst line in it — a long diff loses resolution rather than honesty.
 */
function columns() {
  const flat = [];
  const bounds = [];
  for (const f of state.files) {
    const src = LINES.find(x => x.path === f.path);
    bounds.push({ path: f.path, from: flat.length, count: src.lines.length });
    for (const l of src.lines) flat.push({ ...l, file: f.path });
  }
  const step = Math.max(1, Math.ceil(flat.length / MAX_COLS));
  const cols = [];
  for (let i = 0; i < flat.length; i += step) {
    const group = flat.slice(i, i + step);
    let worst = group[0];
    for (const l of group) if (l.points < worst.points) worst = l;
    cols.push({
      points: worst.points,
      sev: group.some(l => l.sev),
      line: worst.n,
      file: worst.file,
    });
  }
  return { cols, bounds, step };
}

function renderPlot() {
  const { cols, bounds, step } = columns();
  const H = 100;
  const w = Math.max(cols.length, 1);
  const y = v => H - (v / CAP) * H;

  let grid = '';
  for (let p = 1; p <= CAP; p++) {
    grid += '<line x1="0" x2="' + w + '" y1="' + y(p) + '" y2="' + y(p) +
      '" stroke="var(--grid)" stroke-width="0.6"/>';
  }

  const marks = bounds.slice(1).map(b => {
    const x = Math.round(b.from / step);
    return '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + H +
      '" stroke="var(--rule)" stroke-width="1"/>';
  }).join('');

  const bars = cols.map((c, i) => {
    const below = c.points < threshold;
    const h = Math.max(H - y(c.points), below ? 2 : 1);
    const fill = below ? (c.sev ? 'var(--severe)' : 'var(--unread)') : 'var(--muted)';
    return '<rect x="' + i + '" y="' + (H - h) + '" width="1" height="' + h +
      '" fill="' + fill + '" opacity="' + (below ? 1 : 0.22) + '"/>';
  }).join('');

  const ty = y(threshold);
  const rule = '<line x1="0" x2="' + w + '" y1="' + ty + '" y2="' + ty +
    '" stroke="var(--unread)" stroke-width="0.9" stroke-dasharray="3 2"/>';

  const plot = $('plot');
  plot.setAttribute('viewBox', '0 0 ' + w + ' ' + H);
  plot.innerHTML = '<g shape-rendering="crispEdges">' + grid + marks + bars + '</g>' + rule;
  if (!drawn) { plot.classList.add('sweep'); drawn = true; }

  $('scale').textContent = 'pass at ' + threshold + ' of ' + CAP;
  $('tk-cap').textContent = CAP;
  $('tk-thr').textContent = threshold;
  $('tk-thr').style.top = (100 - (threshold / CAP) * 100) + '%';

  $('axis').innerHTML = bounds.map(b =>
    '<button type="button" style="flex:' + b.count + ' 1 0"' +
    ' data-file="' + escapeHtml(b.path) + '"' +
    ' aria-pressed="' + (b.path === selected) + '"' +
    ' title="' + escapeHtml(b.path) + '">' +
    escapeHtml(b.path.split('/').pop()) + '</button>').join('');
  for (const b of $('axis').querySelectorAll('button')) {
    b.addEventListener('click', () => select(b.dataset.file));
  }

  bindReadout(cols, w);
}

/** Pointing at the plot reads out the line under the pointer, as a gauge would. */
function bindReadout(cols, w) {
  const plot = $('plot');
  const idle = () => {
    $('readout').innerHTML = '<b>' + state.unseen + '</b> under the rule';
  };
  idle();
  plot.onpointerleave = idle;
  plot.onpointermove = e => {
    const box = plot.getBoundingClientRect();
    if (!box.width) return;
    const i = Math.min(cols.length - 1,
      Math.max(0, Math.floor(((e.clientX - box.left) / box.width) * w)));
    const c = cols[i];
    $('readout').innerHTML = escapeHtml(c.file.split('/').pop()) + ':' + c.line +
      '  <b>' + c.points + '</b>/' + CAP;
  };
}

function renderFiles() {
  $('files').innerHTML = state.files.map(f => {
    const sev = f.unseen > 0 && isSev(f.risk);
    return '<tr data-file="' + escapeHtml(f.path) + '"' +
      ' aria-selected="' + (f.path === selected) + '"' +
      (f.unseen ? '' : ' class="done"') + '>' +
      '<td class="path">' + escapeHtml(f.path) + '</td>' +
      '<td class="n">' + (f.unseen
        ? '<span class="u' + (sev ? ' sev' : '') + '">' + f.unseen + '</span>'
        : '0') +
        '<span class="of"> / ' + f.changed + '</span></td>' +
      '<td class="n changed">' + f.changed + '</td>' +
      '<td class="risk' + (sev ? ' sev' : '') + '">' +
        (f.unseen ? escapeHtml(f.hunks[0].reason) : 'nothing') + '</td>' +
    '</tr>';
  }).join('');
  for (const row of $('files').querySelectorAll('tr[data-file]')) {
    row.addEventListener('click', () => select(row.dataset.file));
  }
}

function renderCode() {
  const file = LINES.find(f => f.path === selected);
  if (!file) {
    $('code').innerHTML = '';
    $('code-name').textContent = 'Lines';
    $('caption').textContent = 'nothing opened here yet';
    return;
  }
  $('code').innerHTML = file.lines.map(l => {
    const read = isRead(l, threshold);
    const cls = read ? 'read' : 'unread' + (l.sev ? ' sev' : '');
    return '<div class="ln ' + cls + '" data-line="' + l.n + '">' +
      '<span class="num">' + l.n + '</span>' +
      '<span class="txt">' + escapeHtml(l.text || ' ') + '</span></div>';
  }).join('');

  const f = state.files.find(x => x.path === selected);
  $('code-name').textContent = f.path;
  $('caption').textContent = f.unseen
    ? f.unseen + ' of ' + f.changed + ' unread, in ' + plural(f.hunks.length, 'run', 'runs')
    : 'all ' + f.changed + ' read';

  if (!vscode) return;
  for (const ln of $('code').querySelectorAll('.ln.unread')) {
    ln.addEventListener('click', () =>
      vscode.postMessage({ type: 'open', file: selected, line: Number(ln.dataset.line) }));
  }
}

// ---------------------------------------------------------------- settings

/** Ask the extension to write a setting. Nothing changes here until it says so. */
function put(key, value) {
  if (vscode) vscode.postMessage({ type: 'setting', key, value });
}

const MODES = [
  ['auto', 'Auto', 'The diff in a git repository, reading anywhere else.'],
  ['diff', 'Diff', 'The lines you changed, since your last completed review.'],
  ['reading', 'Reading', 'Every line of every file you have opened here.'],
];

const FLAGS = [
  ['decorateUnreviewed', 'Gutter marks'],
  ['showStatusBar', 'Status bar'],
  ['explainOnHover', 'Explain on hover'],
];

function renderThreshold() {
  const saved = DATA.panel.reviewThresholdPoints;
  $('thr-out').textContent = threshold + ' of ' + CAP;
  const tail = threshold === saved
    ? 'Saved.'
    : 'Release to save. Your setting is still <span class="n">' + saved + '</span>.';
  $('thr-note').innerHTML = '<span class="n">' + state.unseen + '</span> of ' +
    '<span class="n">' + state.total + '</span> lines fall under the rule here. ' + tail;
}

function renderModes() {
  const current = DATA.panel.mode;
  $('mode').innerHTML = MODES.map(([value, label]) =>
    '<button type="button" data-mode="' + value + '" aria-pressed="' +
    (value === current) + '">' + label + '</button>').join('');
  for (const b of $('mode').querySelectorAll('button')) {
    b.addEventListener('click', () => put('mode', b.dataset.mode));
  }
  $('mode-note').textContent = (MODES.find(m => m[0] === current) || MODES[0])[2];
}

function renderFlags() {
  $('flags').innerHTML = FLAGS.map(([key, label]) =>
    '<button class="flag" type="button" data-key="' + key + '" aria-pressed="' +
    (DATA.panel[key] === true) + '">' + label + '</button>').join('');
  for (const b of $('flags').querySelectorAll('button')) {
    b.addEventListener('click', () => put(b.dataset.key, b.getAttribute('aria-pressed') !== 'true'));
  }
}

const SIGNALS = [
  ['visible', s => 'on screen for ' + ms(s.visibleMsForPoint) + ' or more'],
  ['focused', s => 'in the active editor, window focused, for ' + ms(s.focusedMsForPoint)],
  ['dwell', s => 'the viewport held still for ' + ms(s.dwellMs)],
  ['caret', () => 'the cursor landed on it, or the mouse came to rest'],
  ['edited', () => 'you typed it yourself'],
  ['revisit', s => 'you came back after ' + ms(s.revisitGapMs) + ' away'],
];

function ms(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '—';
  return n >= 1000 ? +(n / 1000).toFixed(n % 1000 ? 1 : 0) + ' s' : n + ' ms';
}

// The signals come from the configured weights, not from a table written by
// hand: a panel that says +1 while the config says +2 is worse than one that
// says nothing.
function renderDefinition() {
  const cfg = DATA.settings;
  $('signal-rows').innerHTML = SIGNALS.map(([name, when]) =>
    '<tr><td class="k">' + name + '</td>' +
    '<td class="v">' + escapeHtml(when(cfg)) + '</td>' +
    '<td class="pts">+' + escapeHtml(W[name] || 0) + '</td></tr>').join('');

  const rows = [
    ['read after', ms(cfg.readAckMs) + ' of focused time on the line'],
    ['focus caps', 'credit stops growing after ' + ms(cfg.focusCapMs)],
    ['idle after', ms(cfg.idleAfterMs) + ' with no caret, scroll, mouse or edit'],
    ['scroll limit', cfg.readingSpeedGuard
      ? 'past ' + cfg.maxLinesPerSecond + ' lines a second, nothing counts'
      : 'off'],
    ['focus falloff', cfg.focalModel
      ? 'full within ' + cfg.focalSpanLines + ' lines, down to ' + cfg.peripheralFloor +
        ' by ' + cfg.focalDecayLines
      : 'off, every visible line credited alike'],
    ['line cost', cfg.contentScaling ? 'thresholds scale with tokens on the line' : 'off'],
  ];
  $('setting-rows').innerHTML = rows.map(([k, v]) =>
    '<tr><td class="k">' + k + '</td><td class="v" colspan="2">' +
    escapeHtml(v) + '</td></tr>').join('');
}

function select(path) {
  selected = path;
  renderPlot();
  renderFiles();
  renderCode();
}

function renderAll() {
  state = compute(threshold);
  state.files = rank(state.files);
  if (!state.files.some(f => f.path === selected)) {
    selected = state.files.length ? state.files[0].path : null;
  }
  renderAnswer();
  renderPlot();
  renderFiles();
  renderCode();
  renderThreshold();
  renderModes();
  renderFlags();
  renderDefinition();
}

// Dragging previews; letting go is what asks for the change.
$('thr').addEventListener('input', e => {
  threshold = Number(e.target.value);
  renderAll();
});
$('thr').addEventListener('change', e => put('reviewThresholdPoints', Number(e.target.value)));

$('go').addEventListener('click', () => {
  if (vscode) vscode.postMessage({ type: 'reviewNext' });
});

if (vscode) document.documentElement.classList.add('vscode');

function load(data) {
  DATA = data;
  W = data.weights;
  CAP = Object.values(W).reduce((a, b) => a + b, 0);
  LINES = index(data);
  threshold = data.threshold;
  $('thr').max = String(CAP);
  $('thr').value = String(threshold);
  renderAll();
}

window.addEventListener('message', e => load(e.data));
load(__DATA__);
</script>
